<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siennic Wiki</title>
  <style>
    :root {
      --font-family: 'Times New Roman', Times, serif;
      --text-color: #202122;
      --bg-color: #ffffff;
      --link-color: #0645ad;
      --border-color: #a2a9b1;
      --header-bg: #f8f9fa;
    }

    body {
      font-family: var(--font-family);
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.4em;
      font-weight: bold;
      text-decoration: none;
      color: #000;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, input[type="text"] {
      font-family: inherit;
      padding: 5px 8px;
      border: 1px solid var(--border-color);
      background: #fff;
    }

    .container {
      max-width: 900px;
      width: 100%;
      padding: 2rem;
      box-sizing: border-box;
    }

    .search-box {
      margin: 2rem 0;
      display: flex;
      gap: 5px;
    }

    .search-box input {
      flex: 1;
      font-size: 1.1em;
      padding: 8px 12px;
    }

    h1 {
      font-size: 2em;
      font-weight: normal;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.25em;
      margin-top: 0;
    }

    .result-item {
      display: flex;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 1.5rem;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 1rem;
    }

    .result-thumb {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background-color: var(--header-bg);
      flex-shrink: 0;
    }

    .result-content {
      flex: 1;
    }

    .result-content h3 {
      margin: 0 0 5px 0;
    }

    .result-content a {
      color: var(--link-color);
      text-decoration: none;
      font-size: 1.2em;
    }

    .result-content a:hover {
      text-decoration: underline;
    }

    .result-desc {
      color: #54595d;
      font-size: 0.95em;
    }

    .error-notice {
      background-color: #fee7e6;
      border: 1px solid #b72828;
      color: #b72828;
      padding: 12px;
      margin-bottom: 1rem;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <header>
    <a href="./" class="brand" id="brandTitle">Siennic Wiki</a>
    <div class="controls">
      <label for="langSelect" id="langLabel">Language:</label>
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="en" selected>English</option>
        <option value="siennic">Siennic</option>
        <option value="riverlundi">Riverlundi</option>
        <option value="peschaten">Peschaten</option>
      </select>
    </div>
  </header>

  <div class="container">
    <h1 id="pageTitle" style="text-align: center; border: none; margin-top: 1rem;">Siennic Wiki</h1>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search articles..." oninput="handleSearch(this.value)">
    </div>

    <div id="errorContainer"></div>
    <div id="searchResults"></div>
  </div>

  <script>
    /* 1. Language Translation Engines */
    const RIVERLUNDI_CLUSTERS = [
      "tion", "sion", "ight", "ough", "eigh", "tch", "dge", "str", "spr", "spl",
      "sch", "thr", "shr", "ing", "est", "ph", "gh", "th", "sh", "ch", "wh", "ck",
      "kn", "wr", "ng", "qu", "st", "sp", "sc", "sk", "sm", "sn", "sw", "tr", "dr",
      "pr", "br", "cr", "gr", "fr", "pl", "bl", "cl", "gl", "fl", "sl", "nd", "nt",
      "mp", "lt", "ld", "ee", "ea", "oo", "ou", "ow", "ai", "ay", "oa", "oe", "ie",
      "ei", "ue", "ew", "ui", "au", "aw", "oi", "oy", "er", "ir", "ur", "ar", "or",
      "al", "el"
    ];[cite: 1, 3]

    function matchCaps(original, transformed) {
      const isFirstCap = /^[A-Z]/.test(original);
      const isAllCap = original.length > 1 && original === original.toUpperCase();
      let lower = transformed.toLowerCase();
      if (isAllCap) return lower.toUpperCase();
      if (isFirstCap) return lower.charAt(0).toUpperCase() + lower.slice(1);
      return lower;
    }[cite: 1]

    function processWord(word, transformFn) {
      return word.replace(/[a-zA-Z]+/g, function(w) {
        return matchCaps(w, transformFn(w));
      });
    }[cite: 1]

    function transformSiennic(word) {
      return word.split('').reverse().join('');
    }[cite: 1]

    function transformRiverlundi(word) {
      let lower = word.toLowerCase();
      let tokens = [];
      let i = 0;
      while (i < lower.length) {
        let matched = false;
        for (let c of RIVERLUNDI_CLUSTERS) {
          if (lower.startsWith(c, i)) {
            tokens.push(c);
            i += c.length;
            matched = true;
            break;
          }
        }
        if (!matched) { tokens.push(lower[i]); i++; }
      }
      return tokens.reverse().join('');
    }[cite: 1]

    function transformPeschaten(word) {
      if (word.length === 1) return "sht";[cite: 1, 2]
      const reversed = word.split('').reverse().join('');
      const removedChar = reversed.slice(-1).toLowerCase();
      const base = reversed.slice(0, -1);
      let suffix = "itna";[cite: 1, 2]
      if ("aeiou".includes(removedChar)) suffix = "aten";[cite: 1, 2]
      else if ("yw".includes(removedChar)) suffix = "vuhtvad";[cite: 1, 2]
      return base + suffix;
    }[cite: 1, 2]

    function translateText(text, lang) {
      if (!text || lang === 'en') return text;
      let fn = transformSiennic;
      if (lang === 'riverlundi') fn = transformRiverlundi;
      if (lang === 'peschaten') fn = transformPeschaten;
      return processWord(text, fn);
    }

    /* 2. Application Logic */
    let currentLang = 'en';
    let articlesData = [];

    window.addEventListener('DOMContentLoaded', async () => {
      await loadArticles();
      renderPage();
    });

    async function loadArticles() {
      const errorDiv = document.getElementById('errorContainer');
      errorDiv.innerHTML = '';

      if (window.location.protocol === 'file:') {
        errorDiv.innerHTML = `<div class="error-notice"><strong>Browser Security Block:</strong> Browsers block loading <code>articles.json</code> directly when opening HTML files via <code>file://</code>. Please test using a local server (like VS Code Live Server) or deploy to GitHub Pages.</div>`;
        return;
      }

      try {
        const response = await fetch('articles.json');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} - ${response.statusText}`);
        }
        articlesData = await response.json();
      } catch (err) {
        errorDiv.innerHTML = `<div class="error-notice"><strong>Error loading articles.json:</strong> ${err.message}. Make sure <code>articles.json</code> exists in the same folder as <code>index.html</code> and has valid JSON syntax.</div>`;
        articlesData = [];
      }
    }

    function changeLanguage(lang) {
      currentLang = lang;
      renderPage();
    }

    function renderPage() {
      document.getElementById('brandTitle').innerText = translateText("Siennic Wiki", currentLang);
      document.getElementById('pageTitle').innerText = translateText("Siennic Wiki", currentLang);
      document.getElementById('langLabel').innerText = translateText("Language:", currentLang);
      document.getElementById('searchInput').placeholder = translateText("Search articles...", currentLang);

      const query = document.getElementById('searchInput').value;
      handleSearch(query);
    }

    function handleSearch(filter) {
      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '';
      const cleanFilter = filter.toLowerCase().trim();

      if (!Array.isArray(articlesData) || articlesData.length === 0) {
        return;
      }

      let matchCount = 0;

      articlesData.forEach(article => {
        const rawTitle = article.title || "";
        const rawDesc = article.description || article.heading || "";
        const articleSlug = article.slug || article.file || article.url || "";
        
        // Build path: check if user already wrote 'articles/' or just the filename
        const articleUrl = articleSlug.startsWith('articles/') ? `./${articleSlug}` : `./articles/${articleSlug}`;
        
        let thumbUrl = null;
        if (article.thumb) {
          thumbUrl = article.thumb.startsWith('thumbs/') ? `./${article.thumb}` : `./thumbs/${article.thumb}`;
        }

        if (rawTitle.toLowerCase().includes(cleanFilter) || rawDesc.toLowerCase().includes(cleanFilter)) {
          matchCount++;
          const translatedTitle = translateText(rawTitle, currentLang);
          const translatedDesc = translateText(rawDesc, currentLang);

          const div = document.createElement('div');
          div.className = 'result-item';
          
          let imgHTML = '';
          if (thumbUrl) {
            imgHTML = `<img src="${thumbUrl}" alt="${translatedTitle}" class="result-thumb" onerror="this.style.display='none'">`;
          }

          div.innerHTML = `
            ${imgHTML}
            <div class="result-content">
              <h3><a href="${articleUrl}">${translatedTitle}</a></h3>
              <div class="result-desc">${translatedDesc}</div>
            </div>
          `;
          resultsContainer.appendChild(div);
        }
      });

      if (matchCount === 0 && cleanFilter !== '') {
        resultsContainer.innerHTML = `<p style="color: #54595d;">${translateText("No articles found matching your search.", currentLang)}</p>`;
      }
    }
  </script>
</body>
</html>
